name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: structure / tool coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate power structure and tool coverage
        run: python3 scripts/validate.py
